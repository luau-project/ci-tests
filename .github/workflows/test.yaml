name: Test

on: push

jobs:
  test:
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    strategy:
      fail-fast: false
      matrix:

        lua-version:
          - 5.1
          - 5.2
          - 5.3
          - 5.4
          - 5.5
          - luajit
          - openresty

        toolchain:
          - msvc
          - gcc

    steps:
      - uses: actions/checkout@v7

      - uses: step-security/msvc-dev-cmd@v1
        if: matrix.toolchain == 'msvc'

      - name: Build and test (MSVC)
        if: matrix.toolchain == 'msvc'
        run: |
          SET "PREFIX=%PROGRAMFILES%\OpenSSL"
          SET "PATH=%PREFIX%\bin;%PATH%"
          nmake /F nmake.mk "PREFIX=%PREFIX%" "MULTILIB=lib\VC\x64\MD" clean all test
          ECHO %PREFIX%\bin>>%GITHUB_PATH%

      - name: Build and test (GCC)
        if: matrix.toolchain == 'gcc'
        run: |
          SET "PREFIX=C:\mingw64\opt"
          SET "PATH=%PREFIX%\bin;%PATH%"
          mingw32-make "PREFIX=%PREFIX%" clean all test
          ECHO %PREFIX%\bin>>%GITHUB_PATH%

      - uses: actions/checkout@v7
        with:
          repository: lunarmodules/luasec
          path: luasec

      - name: Setup Lua and LuaRocks
        uses: luau-project/setup-lua@v2
        with:
          lua-version: ${{ matrix.lua-version }}

      - name: Patch to luasec
        working-directory: luasec
        run: git apply ..\luasec-winstore.patch

      - name: Configure LuaRocks for OpenSSL (MSVC)
        if: matrix.toolchain == 'msvc'
        working-directory: luasec
        run: |
          SET "OPENSSL_DIR=%PROGRAMFILES%\OpenSSL"
          SET "OPENSSL_LIBDIR=%OPENSSL_DIR%\lib\VC\x64\MD"
          ECHO luarocks make luasec-1.3.2-1.rockspec ^
            "OPENSSL_DIR=%OPENSSL_DIR%" ^
            "OPENSSL_LIBDIR=%OPENSSL_LIBDIR%"
          luarocks make luasec-1.3.2-1.rockspec ^
            "OPENSSL_DIR=%OPENSSL_DIR%" ^
            "OPENSSL_LIBDIR=%OPENSSL_LIBDIR%"

      - name: Configure LuaRocks for OpenSSL (GCC)
        if: matrix.toolchain == 'gcc'
        working-directory: luasec
        run: |
          SET "OPENSSL_DIR=C:\mingw64\opt"
          ECHO luarocks make luasec-1.3.2-1.rockspec ^
            "OPENSSL_DIR=%OPENSSL_DIR%"
          luarocks make luasec-1.3.2-1.rockspec ^
            "OPENSSL_DIR=%OPENSSL_DIR%"

      - name: Run first test file
        run: lua test-1.lua

      - name: Run second test file
        run: lua test-2.lua
