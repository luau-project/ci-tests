name: File Key test

on: push

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:

        lua-version:
          - 5.1
          - 5.2
          - 5.3
          - 5.4
          - 5.5

        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

        toolchain:
          - msvc
          - gcc

        refs:
          - true
          - false

        exclude:
          - os: ubuntu-latest
            toolchain: msvc
            refs: true

          - os: ubuntu-latest
            toolchain: msvc
            refs: false

          - os: ubuntu-latest
            toolchain: gcc
            refs: true

          - os: macos-latest
            toolchain: msvc
            refs: true

          - os: macos-latest
            toolchain: msvc
            refs: false

          - os: macos-latest
            toolchain: gcc
            refs: true

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSVC
        if: runner.os == 'Windows' && matrix.toolchain == 'msvc'
        uses: step-security/msvc-dev-cmd@v1

      - name: Setup Lua / LuaRocks
        uses: luau-project/setup-lua@v3
        with:
          lua-version: ${{ matrix.lua-version }}

      - name: Install POC (Unix)
        if: runner.os != 'Windows'
        run: luarocks make lua-filekey-dev-1.rockspec

      - name: Install POC (Windows without ReFS)
        if: runner.os == 'Windows' && !matrix.refs
        run: luarocks make lua-filekey-dev-1.rockspec

      - name: Install POC (Windows with ReFS)
        if: runner.os == 'Windows' && matrix.refs
        run: luarocks make lua-filekey-refs-dev-1.rockspec

      - name: Test files
        run: lua test-file.lua

      - name: Test symlinks
        run: lua test-link.lua
